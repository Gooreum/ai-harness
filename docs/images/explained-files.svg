<rect x="716" y="434" width="180" height="62" rx="9" class="r-ai"/>
<text x="806" y="458" text-anchor="middle" class="s-m">리뷰어</text>
<text x="806" y="476" text-anchor="middle" class="s-s">Edit·Write 없는 서브에이전트</text>

