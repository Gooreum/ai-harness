<text x="806" y="196" text-anchor="middle" class="s-s">tool-count</text>
<text x="806" y="214" text-anchor="middle" class="s-s">protect-generated</text>
<text x="806" y="232" text-anchor="middle" class="s-s">guard-state</text>
<text x="806" y="250" text-anchor="middle" class="s-s">stage-context</text>
<text x="806" y="268" text-anchor="middle" class="s-s">review-record</text>
