<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" height="270" role="img" aria-label="도구를 쓰기 직전에 PreToolUse, 쓴 직후에 PostToolUse, 응답을 마치려 할 때 Stop 훅이 돈다. Stop 훅이 붙잡으면 AI는 이유를 받고 다시 일한다"><style>
svg{--bg:#f7f6f2; --panel:#ffffff; --fg:#1d2230; --muted:#5d6475; --line:#e2e0d8;
  --accent:#2f5bd3; --accent-bg:#e9eefc;
  --ai:#6b4fd6; --ai-bg:#efeafd;
  --hook:#c4580f; --hook-bg:#fdf0e5;
  --block:#c22f3a; --block-bg:#fce9ea;
  --pass:#1f8a52; --pass-bg:#e5f5ec;
  --human:#2f7fa8; --human-bg:#e4f2f9;}
@media (prefers-color-scheme: dark){svg{--bg:#14161c; --panel:#1c1f27; --fg:#e8e9ee; --muted:#a2a8b8; --line:#2e323d;
  --accent:#86a6ff; --accent-bg:#1f2a47;
  --ai:#b3a1ff; --ai-bg:#2a2445;
  --hook:#ffa463; --hook-bg:#3a2617;
  --block:#ff8089; --block-bg:#3d1d21;
  --pass:#66d49a; --pass-bg:#173525;
  --human:#7cc6ec; --human-bg:#163040;}}
text{font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.bg{fill:var(--bg)}
.s-t{fill:var(--fg);font-size:14px;font-weight:700}
.s-s{fill:var(--muted);font-size:12px}
.s-h{fill:var(--hook);font-size:13px;font-weight:700}
.s-b{fill:var(--block);font-size:13px;font-weight:700}
.s-line{stroke:var(--muted);stroke-width:1.6;fill:none}
.s-hl{stroke:var(--hook);stroke-width:1.8;fill:none}
.r-ai{fill:var(--ai-bg);stroke:var(--ai);stroke-width:1.4}
.r-hook{fill:var(--hook-bg);stroke:var(--hook);stroke-width:1.4}
.r-block{fill:var(--block-bg);stroke:var(--block);stroke-width:1.4}
.r-tool{fill:var(--panel);stroke:var(--muted);stroke-width:1.2}
.r-human{fill:var(--human-bg);stroke:var(--human);stroke-width:1.4}
.lane{fill:var(--bg);stroke:var(--line);stroke-width:1}
.r-file{fill:var(--panel);stroke:var(--muted);stroke-width:1.1}
.r-pass{fill:var(--pass-bg);stroke:var(--pass);stroke-width:1.4}
.s-m{fill:var(--fg);font-size:12.5px;font-weight:700}
.s-bl{stroke:var(--block);stroke-width:1.8;fill:none}
.s-lab{fill:var(--muted);font-size:11px}
.s-labh{fill:var(--hook);font-weight:700}
.s-labb{fill:var(--block);font-weight:700}
.numc{fill:var(--accent)}
.numt{fill:var(--bg);font-size:11px;font-weight:700}
</style><rect class="bg" x="0" y="0" width="700" height="270"/>
      <defs>
        <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" style="color:var(--muted)"/></marker>
        <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" style="color:var(--hook)"/></marker>
      </defs>
      <rect x="20" y="20" width="140" height="56" rx="10" class="r-ai"/>
      <text x="90" y="54" text-anchor="middle" class="s-t">AI 생각</text>
      <path d="M90 76 V100" class="s-line" marker-end="url(#m1)"/>
      <rect x="20" y="104" width="140" height="56" rx="10" class="r-block"/>
      <text x="90" y="128" text-anchor="middle" class="s-b">도구 실행 전</text>
      <text x="90" y="147" text-anchor="middle" class="s-s">PreToolUse</text>
      <path d="M160 132 H206" class="s-line" marker-end="url(#m1)"/>
      <rect x="210" y="104" width="130" height="56" rx="10" class="r-tool"/>
      <text x="275" y="128" text-anchor="middle" class="s-t">도구 실행</text>
      <text x="275" y="147" text-anchor="middle" class="s-s">파일 고치기 등</text>
      <path d="M340 132 H386" class="s-line" marker-end="url(#m1)"/>
      <rect x="390" y="104" width="140" height="56" rx="10" class="r-hook"/>
      <text x="460" y="128" text-anchor="middle" class="s-h">도구 실행 후</text>
      <text x="460" y="147" text-anchor="middle" class="s-s">PostToolUse</text>
      <path d="M460 104 V48 H164" class="s-line" marker-end="url(#m1)"/>
      <text x="312" y="40" text-anchor="middle" class="s-s">도구를 또 요청하면 다시 앞뒤 훅</text>
      <path d="M460 160 V196" class="s-line" marker-end="url(#m1)"/>
      <text x="472" y="184" class="s-s">도구 요청 없이 멈추면</text>
      <rect x="390" y="200" width="140" height="56" rx="10" class="r-hook"/>
      <text x="460" y="224" text-anchor="middle" class="s-h">응답이 끝날 때</text>
      <text x="460" y="243" text-anchor="middle" class="s-s">Stop</text>
      <path d="M530 228 H586" class="s-line" marker-end="url(#m1)"/>
      <rect x="590" y="200" width="96" height="56" rx="10" class="r-human"/>
      <text x="638" y="224" text-anchor="middle" class="s-t">사람</text>
      <text x="638" y="243" text-anchor="middle" class="s-s">차례</text>
      <path d="M390 228 H90 V164" class="s-hl" marker-end="url(#m2)"/>
      <text x="240" y="220" text-anchor="middle" class="s-h">붙잡으면 이유를 받고 다시 일함</text>
    </svg>